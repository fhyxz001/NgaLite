<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配手机屏幕 16:9 展示：宽度跟随设备，移动端字号 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 论坛（BBS）风格导出模板：浅灰页面底 + 白色内容块 + 发丝线分隔 + 链接蓝/楼主金 */
        :root {
            color-scheme: light;
            --page: #EDEFF3;
            --surface: #FFFFFF;
            --divider: #E3E7EC;
            --divider-soft: #F0F2F5;
            --link: #1F6FB2;
            --accent: #2A5F8F;
            --meta: #8B95A1;
            --floor: #A9B3BF;
            --owner-bg: #FFF3D6;
            --owner-text: #9A6B00;
            --quote-bg: #F5F7F9;
            --quote-bar: #B9C6D3;
            --text: #1F2733;
            --text-soft: #5A6572;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--page);
            color: var(--text);
            font-family: 'PingFang SC', 'Helvetica Neue', STHeiti, 'Microsoft Yahei', sans-serif;
        }
        body {
            padding: 10px 10px 22px;
        }
        .page {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }
        /* 标题：白底 + 左侧蓝色竖条 */
        .title {
            margin: 0 0 10px;
            padding: 13px 14px 12px 15px;
            font-size: 19px;
            line-height: 1.45;
            font-weight: 700;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--divider);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            word-break: break-word;
        }
        /* 分享预览区（倒 T 型）：顶部极简提示 / 中部大字标题 / 底部弱化装饰 */
        .share-preview {
            display: flex;
            flex-direction: column;
            margin: 0 0 10px;
            min-height: 420px;
            overflow: hidden;
            border-radius: 4px;
            background: linear-gradient(180deg, #1B3550 0%, #2A5F8F 78%, #17304A 100%);
            color: #ffffff;
        }
        .share-preview.is-hidden {
            display: none !important;
        }
        .preview-top {
            flex: 0 0 auto;
            padding: 14px 18px 6px;
            text-align: center;
        }
        .preview-top-hint {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            line-height: 1;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.55);
        }
        .preview-top-hint .down-arrow {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
        }
        .preview-hero {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 30px 22px;
            text-align: center;
        }
        .preview-title {
            display: block;
            max-width: 100%;
            font-size: 34px;
            line-height: 1.25;
            font-weight: 800;
            letter-spacing: 1px;
            color: #FFFFFF;
            text-align: center;
            word-break: break-word;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }
        .preview-bottom {
            flex: 0 0 auto;
            padding: 6px 18px 16px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.12));
        }
        .preview-bottom-decor {
            display: inline-block;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }
        /* 主楼：白色内容块，头部发丝线分隔 */
        .post-main {
            padding: 13px 14px 14px;
            margin-bottom: 10px;
            border-radius: 4px;
            background: var(--surface);
            border: 1px solid var(--divider);
        }
        .post-main .post-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            padding-bottom: 9px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--divider);
        }
        .post-main .post-head-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .post-main .post-author {
            font-size: 14px;
            font-weight: 700;
            color: var(--link);
        }
        .post-main .post-lz {
            font-size: 11px;
            font-weight: 700;
            color: var(--owner-text);
            background: var(--owner-bg);
            padding: 1px 6px;
            border-radius: 2px;
        }
        .post-main .post-date {
            font-size: 12px;
            color: var(--meta);
            margin-left: auto;
        }
        .post-main .post-likes {
            font-size: 11px;
            font-weight: 600;
            color: var(--owner-text);
            background: var(--owner-bg);
            padding: 1px 6px;
            border-radius: 2px;
        }
        .post-main .post-content {
            font-size: 15px;
            line-height: 1.85;
            color: var(--text);
            word-break: break-word;
        }
        .post-main .post-content p {
            margin: 0 0 0.8em;
        }
        .post-main .post-content p:last-child {
            margin-bottom: 0;
        }
        .post-main .post-content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border-radius: 3px;
            background: var(--quote-bg);
        }
        /* 表情图保持行内，避免被上面的 img 规则撑成独立一块 */
        .post-main .post-content img.emoji {
            display: inline-block;
            height: 1.3em;
            width: auto;
            margin: 0 1px;
            vertical-align: text-bottom;
            background: transparent;
        }
        /* 引用块：左侧竖线 + 浅灰底 */
        .post-main .post-content blockquote {
            margin: 10px 0;
            padding: 8px 10px;
            border-left: 3px solid var(--quote-bar);
            background: var(--quote-bg);
            border-radius: 2px;
            color: var(--text-soft);
            font-size: 13px;
            line-height: 1.75;
        }
        .post-main .post-content blockquote .quote-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--meta);
            margin-bottom: 3px;
        }
        /* 回复区：白色内容块，每条回复发丝线分隔 */
        .replies-section {
            padding: 0 14px;
            border-radius: 4px;
            background: var(--surface);
            border: 1px solid var(--divider);
        }
        .replies-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            padding: 12px 0 10px;
            border-bottom: 1px solid var(--divider);
        }
        .reply-line {
            padding: 10px 0;
            border-bottom: 1px solid var(--divider-soft);
            font-size: 14px;
            line-height: 1.85;
            color: var(--text);
            word-break: break-word;
        }
        .reply-line:last-child {
            border-bottom: none;
            padding-bottom: 12px;
        }
        .reply-line .reply-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .reply-line .reply-author {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--link);
            min-width: 0;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .reply-line .reply-date {
            font-size: 11px;
            color: var(--meta);
        }
        .reply-line .reply-floor {
            font-size: 11px;
            color: var(--floor);
            margin-left: auto;
        }
        .reply-line .reply-body {
            font-size: 14px;
            line-height: 1.85;
            color: var(--text);
            word-break: break-word;
        }
        .reply-line .reply-img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 8px 0;
            border-radius: 3px;
            background: var(--quote-bg);
        }
        .reply-line .reply-emoji {
            display: inline-block;
            height: 1.25em;
            width: auto;
            vertical-align: middle;
            margin: 0 1px;
        }
        .reply-line .reply-quote {
            color: var(--text-soft);
        }
        /* 页脚 */
        .export-footer {
            margin-top: 10px;
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--divider);
            border-radius: 4px;
        }
        .export-footer-line {
            font-size: 12px;
            line-height: 1.6;
            color: var(--meta);
        }
        .export-credit-brand {
            color: var(--accent);
            font-weight: 700;
        }
        .export-credit {
            margin: 6px 0 0;
            font-size: 11px;
            line-height: 1.6;
            color: var(--floor);
            word-break: break-all;
        }
        .is-hidden {
            display: none !important;
        }
        .export-qrcode {
            margin-top: 12px;
            padding: 10px;
            border-radius: 4px;
            background: var(--quote-bg);
            text-align: center;
        }
        .export-qrcode img {
            display: block;
            width: 118px;
            height: 118px;
            margin: 0 auto 6px;
            border-radius: 3px;
            background: #ffffff;
        }
        .export-qrcode-tip {
            display: block;
            font-size: 12px;
            color: var(--meta);
        }
        @page {
            margin: 8mm;
        }
        @media print {
            html, body {
                background: #ffffff;
            }
            body {
                padding: 0;
            }
            .page {
                max-width: none;
                margin: 0;
            }
        }
    </style>
</head>
<body class="{{previewClass}}">
    <main class="page">
        {{previewHeaderHtml}}
        <h1 class="title">{{title}}</h1>
        {{mainPostHtml}}
        {{repliesHtml}}
        <footer class="export-footer">
            <div class="export-footer-line">{{exportedDate}}</div>
            <p class="{{appAttributionClass}}">
                本帖使用<span class="export-credit-brand">NgaLite</span>导出，开源轻量 NGA 第三方客户端。
            </p>
            {{qrCodeHtml}}
        </footer>
    </main>
</body>
</html>
