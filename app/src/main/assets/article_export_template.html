<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配手机屏幕 16:9 展示：宽度跟随设备，移动端字号 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            color-scheme: light;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #FFF8E7;
            color: #1f2937;
            font-family: 'PingFang SC', 'Helvetica Neue', STHeiti, 'Microsoft Yahei', sans-serif;
        }
        body {
            padding: 12px 12px 24px;
        }
        .page {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 20px 18px 26px;
            border-radius: 14px;
            background: #FFFDF7;
            box-shadow: 0 8px 30px rgba(180, 150, 80, 0.10);
        }
        .title {
            margin: 0 0 16px;
            font-size: 20px;
            line-height: 1.4;
            font-weight: 700;
            color: #1a1a1a;
        }
        /* 主楼卡片 */
        .post-main {
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            background: #FFF3D6;
            border: 1px solid #F0E0B8;
        }
        .post-main .post-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .post-main .post-head-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .post-main .post-author {
            font-size: 15px;
            font-weight: 700;
            color: #8B6914;
        }
        .post-main .post-floor {
            font-size: 12px;
            color: #8B6914;
            background: #FFE8B0;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .post-main .post-date {
            font-size: 12px;
            color: #A08850;
        }
        .post-main .post-likes {
            font-size: 12px;
            color: #C97B00;
            background: #FFF0D0;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .post-main .post-content {
            font-size: 16px;
            line-height: 1.8;
            color: #2D2410;
            word-break: break-word;
        }
        .post-main .post-content p {
            margin: 0 0 0.8em;
        }
        .post-main .post-content p:last-child {
            margin-bottom: 0;
        }
        .post-main .post-content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border-radius: 8px;
            background: #FFF8E7;
        }
        .post-main .post-content blockquote {
            margin: 10px 0;
            padding: 10px 12px;
            border-left: 3px solid #D4B860;
            background: #FFFAEC;
            border-radius: 6px;
            color: #6B5A30;
            font-size: 14px;
            line-height: 1.7;
        }
        .post-main .post-content blockquote .quote-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #8B7A40;
            margin-bottom: 4px;
        }
        /* 回复合并区 */
        .replies-section {
            padding: 14px 16px;
            border-radius: 12px;
            background: #FFFAF0;
            border: 1px solid #F0E8D0;
        }
        .replies-title {
            font-size: 13px;
            font-weight: 700;
            color: #8B6914;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #F0E0B8;
        }
        .reply-line {
            font-size: 14px;
            line-height: 1.9;
            color: #3D3220;
            word-break: break-word;
        }
        .reply-line .reply-floor {
            font-weight: 600;
            color: #8B6914;
        }
        /* 页脚 */
        .export-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #E8D8B0;
        }
        .export-footer-line {
            font-size: 12px;
            line-height: 1.6;
            color: #8B7B50;
        }
        .export-credit-brand {
            color: #B8860B;
            font-weight: 700;
        }
        .export-credit {
            margin: 6px 0 0;
            font-size: 11px;
            line-height: 1.6;
            color: #A09870;
            word-break: break-all;
        }
        .is-hidden {
            display: none !important;
        }
        .export-qrcode {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            background: #FFFAEC;
            text-align: center;
        }
        .export-qrcode img {
            display: block;
            width: 120px;
            height: 120px;
            margin: 0 auto 8px;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 2px 10px rgba(180, 150, 80, 0.10);
        }
        .export-qrcode-tip {
            display: block;
            font-size: 12px;
            color: #8B7B50;
        }
        @page {
            margin: 8mm;
        }
        @media print {
            html, body {
                background: #ffffff;
            }
            body {
                padding: 0;
            }
            .page {
                max-width: none;
                margin: 0;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <h1 class="title">{{title}}</h1>
        {{mainPostHtml}}
        {{repliesHtml}}
        <footer class="export-footer">
            <div class="export-footer-line">{{exportedDate}}</div>
            <p class="{{appAttributionClass}}">
                本帖使用<span class="export-credit-brand">NgaLite</span>导出，开源轻量 NGA 第三方客户端。
            </p>
            {{qrCodeHtml}}
        </footer>
    </main>
</body>
</html>
